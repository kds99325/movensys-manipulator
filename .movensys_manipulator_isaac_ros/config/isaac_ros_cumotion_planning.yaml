# Reference copy of isaac_ros_cumotion_moveit planning config for Isaac ROS 4.1.
# NOTE: This file is NOT loaded at runtime. augment_moveit_config() reads directly
#       from the system-installed package:
#       get_package_share_directory('isaac_ros_cumotion_moveit')/config/isaac_ros_cumotion_planning.yaml
# https://nvidia-isaac-ros.github.io/v/release-4.1/repositories_and_packages/isaac_ros_cumotion/isaac_ros_cumotion_moveit/index.html
planning_plugins:
  - isaac_ros_cumotion_moveit/CumotionPlanner
request_adapters:
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
  - default_planning_request_adapters/ResolveConstraintFrames
start_state_max_bounds_error: 0.1
num_steps: 32
