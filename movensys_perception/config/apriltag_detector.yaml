apriltag_detector:
  ros__parameters:
    tag_family: "tag36h11"
    tag_size: 0.04  # meters (40 mm)
    image_topic: "/camera_hand/realsense2_camera/color/image_raw"
    camera_info_topic: "/camera_hand/realsense2_camera/color/camera_info"
    camera_frame: "camera_hand_color_optical_frame"
    nthreads: 1
    quad_decimate: 2.0
    quad_sigma: 0.0
    refine_edges: 1
    decode_sharpening: 0.25
