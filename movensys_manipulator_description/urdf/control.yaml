controller_manager:
    ros__parameters:
        update_rate: 200
        use_sim_time: True

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        gazebo_position_controller:
            type: position_controllers/JointGroupPositionController

gazebo_position_controller:
    ros__parameters:
        joints:
            - joint1
            - joint2
            - joint3
            - joint4
            - joint5
            - joint6
            - picker_1_joint
            - picker_2_joint
        interface_name: position
        command_interfaces:
            - position
        state_interfaces:
            - position
            - velocity
        joint1:
            p: 5000.0
            i: 100.0
            d: 500.0
            i_clamp: 100.0
        joint2:
            p: 10000.0
            i: 200.0
            d: 1000.0
            i_clamp: 200.0
        joint3:
            p: 10000.0
            i: 200.0
            d: 1000.0
            i_clamp: 200.0
        joint4:
            p: 5000.0
            i: 100.0
            d: 500.0
            i_clamp: 100.0
        joint5:
            p: 5000.0
            i: 100.0
            d: 500.0
            i_clamp: 100.0
        joint6:
            p: 2000.0
            i: 50.0
            d: 200.0
            i_clamp: 50.0
        picker_1_joint:
            p: 1000.0
            i: 20.0
            d: 100.0
            i_clamp: 20.0
        picker_2_joint:
            p: 1000.0
            i: 20.0
            d: 100.0
            i_clamp: 20.0