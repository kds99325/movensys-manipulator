name: Test - movensys_manipulator_moveit_config

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'movensys_manipulator_moveit_config/**'

jobs:
  build:
    uses: ./.github/workflows/movensys-manipulator.yml

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, humble]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Restore base image from cache
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/general.Dockerfile
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            HOST_USER_UID=1001
            HOST_USER_GID=1001
          tags: movensys-manipulator:ci-${{ matrix.ros_distro }}
          load: true
          cache-from: type=gha,scope=${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ros_distro }}

      - name: Test sim_bridge and moveit launch files
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/ws_src:ro" \
            -e ROS_DISTRO=${{ matrix.ros_distro }} \
            -e MANIPULATOR_MODEL=dobot_cr3a \
            movensys-manipulator:ci-${{ matrix.ros_distro }} \
            bash -lc "
              set -e
              mkdir -p /home/admin/workspaces/movensys_ws/src
              cp -r /ws_src /home/admin/workspaces/movensys_ws/src/movensys-manipulator
              cd /home/admin/workspaces/movensys_ws
              source /opt/ros/${{ matrix.ros_distro }}/setup.bash
              colcon build --symlink-install
              source install/setup.bash

              echo '=== launch test: sim_bridge (isaacsim) ==='
              timeout 30s ros2 launch movensys_manipulator_moveit_config sim_bridge.launch.py \
                simulator:=isaacsim use_sim_time:=true || [ \$? -eq 124 ] && echo '  OK: sim_bridge exited after 30s'

              echo '=== launch test: moveit ==='
              timeout 30s ros2 launch movensys_manipulator_moveit_config moveit.launch.py \
                use_sim_time:=true || [ \$? -eq 124 ] && echo '  OK: moveit exited after 30s'
            "
