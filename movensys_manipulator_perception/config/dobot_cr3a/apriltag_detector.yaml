apriltag_detector:
  ros__parameters:
    tag_family: "tag36h11"
    tag_size: 0.05  # meters (50 mm)
    image_topic: "/image_hand/rgb"
    camera_info_topic: "/image_hand/camera_info"
    camera_frame: "camera_hand_color_optical_frame"
    nthreads: 1
    quad_decimate: 2.0
    quad_sigma: 0.0
    refine_edges: 1
    decode_sharpening: 0.25
